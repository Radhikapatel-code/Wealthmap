[package]
name = "wealthmap-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance columnar query engine for FIFO tax lot matching and portfolio analytics"

[lib]
name = "wealthmap_engine"
crate-type = ["rlib", "cdylib"]

[dependencies]
arrow = "53.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "=0.4.38", features = ["serde"] }
rayon = "1.10"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"], optional = true }
sqlparser = "0.49"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "engine_benchmark"
harness = false

[features]
default = []
python = ["dep:pyo3"]
